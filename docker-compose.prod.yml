# Production stack. One command, from the repository root:
#
#   cp .env.prod.example .env.prod   # fill it in once
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# See docs/deploy.md for the firewall rules this needs.
name: frequencia

x-restart: &restart
  restart: unless-stopped

services:
  # HTTPS termination, static web app, reverse proxy to api and media.
  caddy:
    <<: *restart
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      media:
        condition: service_healthy

  api:
    <<: *restart
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: https://${DOMAIN}
      DATABASE_URL: postgres://frequencia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/frequencia
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      MEDIA_SHARED_SECRET: ${MEDIA_SHARED_SECRET:?set MEDIA_SHARED_SECRET}
      MEDIA_INTERNAL_URL: ws://media:4100/media/internal
      STUN_URLS: stun:${DOMAIN}:3478
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      UPLOADS_DIR: /data/uploads
    volumes:
      # Chat attachments. Back this up together with the database.
      - uploads-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  media:
    <<: *restart
    build:
      context: .
      dockerfile: apps/media/Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MEDIA_SHARED_SECRET: ${MEDIA_SHARED_SECRET}
      MEDIA_NUM_WORKERS: ${MEDIA_NUM_WORKERS:-2}
      # Browsers are told to send media to these addresses. The private address lets the
      # TURN relay on the same host reach the SFU without leaving the machine.
      RTC_ANNOUNCED_ADDRESSES: ${PUBLIC_IP:?set PUBLIC_IP}${PRIVATE_IP:+,${PRIVATE_IP}}
      RTC_MIN_PORT: 40000
      RTC_MAX_PORT: 40015
    ports:
      # One UDP and one TCP port per worker and announced address (mediasoup WebRtcServer).
      - '40000-40015:40000-40015/udp'
      - '40000-40015:40000-40015/tcp'

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: frequencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: frequencia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U frequencia -d frequencia']
      interval: 5s
      timeout: 3s
      retries: 20

  # Presence, voice state, rate limits and pub/sub: all of it can be rebuilt, so nothing is
  # persisted to disk.
  redis:
    <<: *restart
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # TURN/STUN. Host networking: relaying needs a whole UDP port range, and publishing a
  # range through Docker's proxy is slow and hides the peers' addresses.
  coturn:
    <<: *restart
    image: coturn/coturn:4.6
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      # Time-limited credentials derived from this secret; the API mints them (lib/ice.ts).
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP}${PRIVATE_IP:+/${PRIVATE_IP}}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      # A relay must never become a way into the private network...
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      # ...except to this host, where the SFU listens.
      - --allowed-peer-ip=${PRIVATE_IP:-127.0.0.1}

volumes:
  postgres-data:
  uploads-data:
  caddy-data:
  caddy-config:
