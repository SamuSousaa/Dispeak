name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frequencia
          POSTGRES_PASSWORD: frequencia
          POSTGRES_DB: frequencia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U frequencia" --health-interval 2s
          --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://frequencia:frequencia@localhost:5432/frequencia_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frequencia/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          MEDIA_NUM_WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fill in a throwaway production environment
        run: |
          sed -e 's/^DOMAIN=.*/DOMAIN=example.com/'               -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/'               -e 's/^PUBLIC_IP=.*/PUBLIC_IP=203.0.113.10/'               -e 's/^PRIVATE_IP=.*/PRIVATE_IP=10.0.0.10/'               -e 's/^\(POSTGRES_PASSWORD\|JWT_SECRET\|MEDIA_SHARED_SECRET\|TURN_SECRET\)=.*/=0123456789abcdef0123456789abcdef/'               .env.prod.example > .env.prod
      - name: Validate the compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
      - name: Build the images
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod build
