<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Transmitir</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --surface: #111111;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.16);
        --fg: #ededed;
        --muted: #8a8a8a;
        --accent: #ccf200;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      footer {
        justify-content: flex-end;
        border-bottom: 0;
        border-top: 1px solid var(--line);
      }
      h1 {
        margin: 0 auto 0 0;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      button {
        font: inherit;
        text-transform: inherit;
        letter-spacing: inherit;
        color: var(--fg);
        background: none;
        border: 1px solid var(--line-strong);
        border-radius: 0;
        cursor: pointer;
        transition:
          border-color 180ms,
          color 180ms;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 2px;
      }
      .tab,
      #cancel {
        padding: 6px 10px;
      }
      .tab[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      #grid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        align-content: start;
        gap: 12px;
        padding: 16px;
      }
      .source {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        background: var(--surface);
        border-color: var(--line);
        text-align: left;
      }
      .source img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        background: #000;
      }
      .source span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .empty {
        grid-column: 1 / -1;
        margin: 48px 0;
        text-align: center;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>O que transmitir</h1>
      <div id="tabs" style="display: flex; gap: 8px"></div>
    </header>
    <main id="grid"></main>
    <footer>
      <button id="cancel" type="button">[ Cancelar ]</button>
    </footer>
    <script src="../dist/picker.global.js"></script>
  </body>
</html>
