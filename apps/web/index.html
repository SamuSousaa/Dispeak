<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Dispeaker" />
    <meta name="apple-mobile-web-app-title" content="Dispeaker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Dispeaker</title>
    <style>
      /* The opening screen. Here rather than in the stylesheet so it paints with the document;
         the app's BootScreen component reuses these classes. */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: var(--bg, #0a0a0a);
      }
      .boot-mark {
        position: absolute;
        top: 40%;
        left: 50%;
        width: 88px;
        height: 88px;
        transform: translate(-50%, -50%);
        fill: none;
        stroke-width: 2;
        stroke-linecap: square;
      }
      .boot-rest {
        stroke: var(--line-strong, rgba(255, 255, 255, 0.16));
      }
      .boot-trace {
        stroke: var(--accent, #ccf200);
        stroke-dasharray: 100;
        animation: boot-trace 1800ms linear infinite;
      }
      .boot-status {
        position: absolute;
        top: calc(40% + 72px);
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 16px;
      }
      .boot-pending {
        animation: boot-blink 1200ms steps(2, jump-none) infinite;
      }
      /* Switches off like a screen: closes to a line, then goes dark. */
      .boot[data-leaving] {
        pointer-events: none;
        animation: boot-off 320ms cubic-bezier(0.5, 0, 0.9, 0.3) forwards;
      }
      /* Drawn from the left, held, then let go from the left: a signal passing through. */
      @keyframes boot-trace {
        0% {
          stroke-dashoffset: 100;
          animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
        50%,
        65% {
          stroke-dashoffset: 0;
          animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
        }
        100% {
          stroke-dashoffset: -100;
        }
      }
      @keyframes boot-blink {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.45;
        }
      }
      @keyframes boot-off {
        70% {
          clip-path: inset(49.6% 0);
          opacity: 1;
        }
        100% {
          clip-path: inset(49.6% 0);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-trace,
        .boot-pending {
          animation: none;
        }
        .boot[data-leaving] {
          animation: boot-fade 1ms forwards;
        }
      }
      @keyframes boot-fade {
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path class="boot-rest" pathLength="100" d="M5 16h4l3-9 5 18 4-13 2 4h4" />
          <path class="boot-trace" pathLength="100" d="M5 16h4l3-9 5 18 4-13 2 4h4" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
